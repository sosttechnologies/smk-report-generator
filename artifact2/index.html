<title>SMK Termly Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Hanken+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.7.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.13.0/mammoth.browser.min.js"></script>

<style>
/* ============================================================
   SMK Gateway — Termly Report Generator
   Tokens are taken verbatim from the design handoff README.
   Deliberately single-theme: this is a paper-document tool and
   commits to one light visual world, so every colour is painted
   explicitly rather than inherited from the host.
   ============================================================ */
:root{
  --page:#F7F6F3; --side:#F1EFEA; --canvas:#EFEDE8; --surface:#FFFFFF;
  --subtle:#FBFAF8; --subtle-2:#F5F3EF; --track:#EDEAE4; --hover:#E8E5DE; --active:#DBD6CB;
  --ink:#1B1A17; --body:#2A2925; --body-2:#4A4843; --muted:#6B6862; --faint:#9A968E;
  --border:#E6E3DC; --divider:#EFECE6; --dashed:#CFCAC0; --off:#D9D5CD;
  --accent:oklch(0.5 0.16 262); --accent-soft:oklch(0.95 0.03 262);
  --accent-tint:oklch(0.975 0.012 262); --ring:0 0 0 3px oklch(0.93 0.04 262);
  --pos:oklch(0.52 0.12 155); --pos-soft:oklch(0.95 0.04 155);
  --priv:oklch(0.45 0.12 30); --priv-soft:oklch(0.94 0.03 30);
  --sh-page:0 1px 3px rgba(27,26,23,.08), 0 12px 32px rgba(27,26,23,.07);
  --sh-modal:0 24px 64px rgba(27,26,23,.22);
  --sh-pop:0 8px 24px rgba(27,26,23,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:'Instrument Sans',system-ui,sans-serif;font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
h1,h2,h3{font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:600;letter-spacing:-.02em;margin:0}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:6px}
::selection{background:var(--accent-soft)}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:8px;background:var(--ink);color:#fff;padding:9px 16px;
  font-weight:500;transition:background .12s}
.btn:hover{background:#33312C}
.btn:disabled{background:var(--off);cursor:not-allowed}
.btn-2{background:var(--surface);color:var(--ink);border:1px solid var(--border);
  border-radius:8px;padding:8px 14px;font-weight:500;transition:border-color .12s}
.btn-2:hover{border-color:var(--dashed)}
.btn-2:disabled{color:var(--faint);cursor:not-allowed;border-color:var(--border)}
.btn-ghost{background:none;border:0;color:var(--muted);padding:6px 10px;border-radius:7px}
.btn-ghost:hover{background:var(--hover);color:var(--ink)}
.btn-danger{color:oklch(0.5 0.17 27)}

/* ---------- app frame ---------- */
#app{display:grid;grid-template-columns:260px minmax(0,1fr);height:100%}
#sidebar{background:var(--side);border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0}
.side-top{padding:16px 14px 10px;display:flex;align-items:center;gap:10px}
.side-top img{height:30px;width:auto;mix-blend-mode:multiply}
.side-actions{padding:0 10px 10px;display:flex;flex-direction:column;gap:2px}
.side-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;padding:7px 10px;border-radius:8px;color:var(--body);
  font-size:13px;position:relative}
.side-row:hover{background:var(--hover)}
.side-row.on{background:var(--hover);font-weight:500;color:var(--ink)}
.plus{width:20px;height:20px;border-radius:999px;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-size:13px;line-height:1;flex:none}
.side-search{margin:4px 10px 12px}
.side-search input{width:100%;height:34px;border-radius:8px;background:var(--surface);
  border:1px solid var(--border);padding:0 11px;font-size:13px}
.side-search input:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
.side-scroll{flex:1;overflow:auto;padding:0 10px 10px;min-height:0}
.side-head{display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:12px 10px 6px;min-height:26px}
.side-head button{width:22px;height:22px;border-radius:6px;background:none;border:0;
  color:var(--muted);display:grid;place-items:center;font-size:15px}
.side-head button:hover{background:var(--hover);color:var(--ink)}
.side-item{display:block;width:100%;text-align:left;background:none;border:0;
  padding:6px 10px;border-radius:8px;position:relative}
.side-item:hover{background:var(--hover)}
.side-item.on{background:var(--active)}
.side-item.on:hover{background:var(--active)}
.side-row.on{background:var(--active)}
.dim-row{opacity:.58}
.dim-row:hover{opacity:.85}
.pin-ic{font-size:9px;margin-right:5px;opacity:.75;vertical-align:1px}
.unread-dot{display:inline-block;width:6px;height:6px;border-radius:999px;
  background:var(--accent);margin-right:6px;vertical-align:1px}
/* Overrides the 22px square sizing .side-head button applies to the "+" icon,
   which was squashing this label and overlapping the group heading below it. */
.side-head .arch-tog{width:auto;height:auto;display:inline;background:none;border:0;
  padding:0;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);white-space:nowrap}
.side-head .arch-tog:hover{background:none;color:var(--body)}
.side-item.has-chev{padding-left:4px;display:flex;align-items:center;gap:6px}
.side-item.has-chev .l1{flex:1;min-width:0;padding-right:20px}
.chev-btn{width:14px;height:14px;flex:none;color:var(--faint);
  border-radius:3px;transition:transform .14s,color .12s;
  display:grid;place-items:center}
.chev-btn svg{width:9px;height:9px;display:block}
.side-item:hover .chev-btn{color:var(--body)}
.chev-btn:hover{color:var(--ink);background:var(--dashed)}
.chev-btn.open{transform:rotate(90deg)}
.ic{width:15px;height:15px;flex:none;color:var(--muted);display:block}
.side-item.on .ic{color:var(--ink)}
.nest .side-item{display:flex;align-items:center;gap:7px}
.nest .side-item .lines{flex:1;min-width:0}
.nest{margin:1px 0 4px 15px;padding-left:9px;border-left:1px solid var(--border)}
.nest .side-item{padding:5px 9px}
.nest .side-item .l1{font-size:12.5px;padding-right:20px}
.nest .side-item .l2{font-size:11px}
.nest-empty{font-size:11.5px;color:var(--faint);padding:5px 9px}
/* Both lines must be block boxes. As inline spans they ran together, so the
   project name appeared tacked onto the end of the report title. */
.side-item .l1{display:block;font-size:13px;color:var(--body);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;padding-right:22px}
.side-item.on .l1{font-weight:500;color:var(--ink)}
.side-item .l2{display:block;font-size:11.5px;color:var(--faint);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;padding-right:22px}
.dots{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:26px;height:26px;
  border-radius:6px;background:none;border:0;color:var(--muted);opacity:0;
  display:grid;place-items:center;transition:opacity .12s}
.side-item:hover .dots,.side-row:hover .dots,.dots:focus{opacity:1}
.dots:hover{background:var(--dashed)}
.side-foot{border-top:1px solid var(--border);padding:8px 10px}
.avatar{width:26px;height:26px;border-radius:999px;background:oklch(0.9 0.04 262);
  color:oklch(0.35 0.1 262);display:grid;place-items:center;font-size:10.5px;
  font-weight:600;flex:none}
.rename-input{width:100%;border:1px solid var(--accent);border-radius:6px;
  padding:5px 8px;font-size:13px;background:var(--surface)}

/* ---------- main ---------- */
#main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--page)}
#topbar{height:56px;flex:none;border-bottom:1px solid var(--border);display:flex;
  align-items:center;justify-content:space-between;gap:16px;padding:0 20px;background:var(--page)}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.crumb b{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .sep{color:#C9C5BC}
.top-actions{display:flex;align-items:center;gap:10px;flex:none}
#screen{flex:1;overflow:auto;min-height:0}

/* ---------- generic content column ---------- */
.col{max-width:860px;margin:0 auto;padding:52px 32px}
.eyebrow{margin:0 0 14px}
h1.display{font-size:40px;line-height:1.08;letter-spacing:-.025em}
h1.display .alt{color:var(--muted);display:block}
.lede{font-size:15px;color:var(--muted);margin:14px 0 0;max-width:62ch}

/* ---------- upload ---------- */
#drop{margin-top:28px;border:1.5px dashed var(--dashed);border-radius:14px;
  background:var(--surface);padding:44px 26px 38px;text-align:center;transition:.14s;cursor:pointer}
#drop:hover{border-color:var(--muted)}
#drop.over{border-color:var(--accent);background:var(--accent-soft)}
#drop p{margin:0 0 6px;font-size:15px}
#drop .sub{color:var(--muted);font-size:13px;margin-bottom:0}
.drop-ic{width:30px;height:30px;color:var(--muted);margin-bottom:12px;display:block;
  margin-left:auto;margin-right:auto}
#drop:hover .drop-ic,#drop.over .drop-ic{color:var(--accent)}
.browse{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.fmts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
.fmt{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.04em;
  color:var(--muted);background:var(--subtle-2);border:1px solid var(--border);
  border-radius:999px;padding:3px 9px}
.try-line{margin:14px 0 0;font-size:13px;color:var(--faint);text-align:center}
.linkish{background:none;border:0;padding:0;font-size:13px;color:var(--muted);
  text-decoration:underline;text-underline-offset:2px}
.linkish:hover{color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);
  background:var(--surface);border-radius:999px;padding:6px 14px;font-size:12.5px;color:var(--body)}
.pill:hover{border-color:var(--dashed)}
.files{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:40px 1fr auto auto;gap:12px;align-items:center;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;position:relative;overflow:hidden}
.badge{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;
  font-size:9.5px;font-weight:600;letter-spacing:.04em}
.frow .nm{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .de{font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .st{font-size:11.5px;color:var(--muted);white-space:nowrap}
.frow .st.done{color:var(--pos)} .frow .st.bad{color:var(--priv)}
.frow .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);
  width:0;transition:width .25s}
.xbtn{width:26px;height:26px;border-radius:6px;background:none;border:0;color:var(--faint)}
.xbtn:hover{background:var(--hover);color:var(--ink)}
.card{margin-top:20px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:5px}
label.f span{font-size:11.5px;color:var(--muted);font-weight:500}
label.f input,label.f select{height:36px;border:1px solid var(--border);border-radius:8px;
  padding:0 10px;background:var(--surface);font-size:13.5px}
label.f input:focus,label.f select:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
.stu-list{display:flex;flex-direction:column;gap:7px}
.stu-row{display:grid;grid-template-columns:auto minmax(0,1fr) 92px auto;gap:10px;align-items:center}
.stu-row:not(:has(input[type=checkbox])){grid-template-columns:minmax(0,1fr) 92px auto}
.stu-row.off{opacity:.45}
.stu-row input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.stu-name,.stu-ks{height:34px;border:1px solid var(--border);border-radius:8px;padding:0 10px;
  background:var(--surface);font-size:13.5px;min-width:0}
.stu-name:focus,.stu-ks:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
.stu-meta{font-size:11.5px;color:var(--faint);white-space:nowrap}
@media(max-width:640px){
  .stu-row,.stu-row:not(:has(input[type=checkbox])){grid-template-columns:1fr;gap:6px}
  .stu-meta{grid-column:1/-1}
}
.detect{margin-top:14px;font-size:12.5px;color:var(--muted);
  border-top:1px solid var(--divider);padding-top:12px}
.sticky-foot{position:sticky;bottom:0;background:linear-gradient(transparent,var(--page) 28%);
  padding:26px 0 0;margin-top:26px;display:flex;align-items:center;
  justify-content:space-between;gap:16px;flex-wrap:wrap}
.sticky-foot .meta{font-size:12.5px;color:var(--muted)}

/* ---------- generating ---------- */
.gen-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;align-items:start}
@media(max-width:900px){.gen-wrap{grid-template-columns:1fr}}
.progress{height:4px;background:var(--track);border-radius:999px;overflow:hidden;margin:22px 0 28px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:flex;align-items:center;gap:11px;font-size:14px;opacity:.4;transition:opacity .2s}
.step.active,.step.done{opacity:1}
.step .ic{width:18px;height:18px;flex:none;display:grid;place-items:center}
.spinner{width:14px;height:14px;border:2px solid var(--dashed);border-top-color:var(--accent);
  border-radius:999px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
.skel{background:var(--surface);border-radius:4px;box-shadow:var(--sh-page);
  aspect-ratio:1/1.414;padding:26px 22px;display:flex;flex-direction:column;gap:9px}
.skel i{display:block;height:8px;border-radius:3px;background:var(--track)}
.skel i.fade{animation:fade 1.3s ease-in-out infinite}
@keyframes fade{0%,100%{opacity:.45}50%{opacity:1}}

/* ---------- report screen ---------- */
.report-wrap{display:grid;grid-template-columns:minmax(0,1fr) clamp(280px,28vw,360px);
  height:100%;min-height:0}
@media(max-width:860px){.report-wrap{grid-template-columns:1fr}
  #panel{display:none}}
#docscroll{background:var(--canvas);overflow:auto;padding:28px 20px 70px;
  display:flex;flex-direction:column;align-items:safe center;gap:22px;min-height:0}
#panel{border-left:1px solid var(--border);background:var(--page);overflow:auto;
  display:flex;flex-direction:column;min-height:0}
.panel-pad{padding:18px}
.sec-list{display:flex;flex-direction:column;gap:1px;margin-top:12px}
.sec-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;
  border:0;padding:9px 10px;border-radius:8px;font-size:13px;color:var(--body)}
.sec-row:hover{background:var(--hover)}
.sec-row.on{background:var(--accent-soft);color:var(--ink);font-weight:500}
.dot{width:7px;height:7px;border-radius:999px;background:var(--off);flex:none}
.dot.done{background:var(--pos)}
.dot.flag{background:var(--priv)}
.rev-bar{height:3px;background:var(--track);border-radius:999px;overflow:hidden;margin-top:9px}
.rev-bar i{display:block;height:100%;background:var(--pos);width:0;transition:width .3s}
.src{border:1px solid var(--border);background:var(--surface);border-radius:10px;
  padding:11px 12px;margin-bottom:8px}
.src .m{margin-bottom:6px}
.src .t{font-size:12.5px;color:var(--body-2);line-height:1.45}
.chg{font-size:12.5px;color:var(--muted);border-left:2px solid var(--border);
  padding:3px 0 3px 10px;margin-bottom:7px}
.panel-foot{margin-top:auto;border-top:1px solid var(--border);padding:14px 18px;
  display:flex;gap:9px;background:var(--page);position:sticky;bottom:0}
.privnote{background:var(--priv-soft);color:var(--priv);border-radius:8px;
  padding:10px 12px;font-size:12.5px;margin-top:12px}

/* ---------- the document ---------- */
.sheet{background:var(--surface);box-shadow:var(--sh-page);width:min(720px,100%);
  min-width:min(560px,100%);aspect-ratio:1/1.414;padding:40px 44px 70px;position:relative;
  font-family:Carlito,Calibri,sans-serif;color:#111;font-size:13px;line-height:1.45;
  flex:none;overflow:hidden}
.sheet.auto{aspect-ratio:auto;min-height:auto}
.logo-band{position:relative;height:62px;margin-bottom:14px}
.dlogo{position:absolute;top:0;height:auto;max-width:70%;cursor:grab;
  mix-blend-mode:multiply;touch-action:none;user-select:none;
  outline:1px dashed transparent;outline-offset:4px;border-radius:2px;transition:outline-color .12s}
.dlogo:hover{outline-color:var(--dashed)}
.dlogo.dragging{cursor:grabbing;outline-color:var(--accent);opacity:.85}
.dtitle{text-align:center;font-weight:700;font-size:13px}
.dtitle div+div{margin-top:7px}
.dmeta{margin:26px 0 30px;font-weight:700;font-size:12.5px}
.dmeta div+div{margin-top:7px}
.dlabel{font-weight:700;font-size:12.5px;margin-bottom:8px}
.dsec{scroll-margin-top:20px;border-radius:3px;transition:background .12s,box-shadow .12s}
.dsec.sel{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-tint)}
.dtable{width:100%;border-collapse:collapse;table-layout:fixed}
.dtable th,.dtable td{border:.75px solid #111;padding:6px;vertical-align:top;text-align:left;
  font-size:9.5px;line-height:1.35;word-wrap:break-word}
.dtable th{font-weight:700}
.dl{width:100%;border-collapse:collapse;table-layout:fixed}
.dl td{border:.75px solid #111;padding:9px 11px;vertical-align:top;font-size:11.5px;line-height:1.45}
.dl td.lab{width:168px;font-weight:700;text-transform:uppercase;position:relative}
.dl p{margin:0 0 8px} .dl p:last-child{margin:0}
.dl ul{margin:4px 0 8px;padding-left:17px} .dl li{margin-bottom:3px}
.dsub{font-weight:700;margin:8px 0 3px}
.dsub:first-child{margin-top:0}
.dfoot{position:absolute;left:44px;right:44px;bottom:18px;font-size:9.5px;color:#2F4A7A}
.dfoot-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dfoot i{color:#D2232A;font-style:normal}
.dlegal{text-align:center;margin-top:4px}
[contenteditable]{outline:none;border-radius:2px}
[contenteditable]:focus{background:var(--accent-soft)}
.tag{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.07em;
  padding:2px 5px;border-radius:4px;position:absolute;right:6px;top:6px;white-space:nowrap}
.tag.med{background:var(--priv-soft);color:var(--priv)}
.tag.rev{background:var(--pos-soft);color:var(--pos)}

/* ---------- template editor ---------- */
.tpl-wrap{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.tpl-main{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:18px}
.tpl-side{flex:1 1 280px;position:sticky;top:18px}
.block{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px}
.block h3{font-size:15px;margin-bottom:4px}
.block .hint{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.srow2{display:flex;align-items:center;gap:10px;border:1px solid var(--border);
  border-radius:9px;padding:9px 11px;background:var(--subtle);margin-bottom:6px}
.srow2[draggable=true]{cursor:grab}
.srow2.drag{opacity:.4}
.srow2.over{border-color:var(--accent);background:var(--accent-soft)}
.handle{color:var(--faint);cursor:grab;user-select:none;flex:none}
.srow2 .n{font-size:11px;color:var(--faint);width:16px;flex:none}
.srow2 .lb{flex:1;font-size:13px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis}
.srow2 .src2{font-size:11.5px;color:var(--faint);flex:none}
.toggle{width:32px;height:18px;border-radius:999px;background:var(--off);border:0;
  position:relative;flex:none;transition:background .15s}
.toggle[aria-pressed=true]{background:var(--accent)}
.toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:999px;
  background:#fff;transition:transform .15s}
.toggle[aria-pressed=true] i{transform:translateX(14px)}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{background:var(--surface);box-shadow:0 1px 2px rgba(27,26,23,.09);aspect-ratio:1/1.414;
  padding:8px;display:flex;flex-direction:column;gap:3px;border-radius:2px}
.mini-logo-band{position:relative;height:13px;margin-bottom:3px;flex:none}
.mini-logo{position:absolute;top:0;height:auto;max-width:72%;mix-blend-mode:multiply}
.mini b{font-size:5px;color:#111;font-weight:700;display:block}
.mini i{display:block;height:2.5px;background:#DEDAD2;border-radius:1px}
textarea.ta{width:100%;border:1px solid var(--border);border-radius:9px;padding:10px 12px;
  font-size:13px;line-height:1.5;resize:vertical;min-height:90px;background:var(--surface)}
textarea.ta:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}

/* ---------- project table ---------- */
table.pt{width:100%;border-collapse:collapse;margin-top:18px;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;overflow:hidden}
table.pt th{text-align:left;padding:10px 14px;font-size:11px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--faint);font-weight:500;border-bottom:1px solid var(--border);
  background:var(--subtle)}
table.pt td{padding:12px 14px;border-bottom:1px solid var(--divider);font-size:13.5px}
table.pt tr:last-child td{border-bottom:0}
.status{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px}
.status.draft{background:var(--side);color:var(--muted)}
.status.ready{background:var(--accent-soft);color:var(--accent)}
.status.shared{background:var(--pos-soft);color:var(--pos)}
.empty-box{border:1.5px dashed var(--dashed);border-radius:12px;padding:40px;
  text-align:center;color:var(--muted);margin-top:18px}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(27,26,23,.28);display:grid;place-items:center;
  padding:20px;z-index:50}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--sh-modal);
  width:min(520px,100%);padding:24px;max-height:90vh;overflow:auto}
.modal h2{font-size:21px;margin-bottom:6px}
.dl-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.dl-tile{border:1px solid var(--border);border-radius:12px;padding:16px;text-align:left;
  background:var(--surface)}
.dl-tile:hover:not(:disabled){border-color:var(--accent)}
.dl-tile:disabled{opacity:.45;cursor:not-allowed}
.dl-tile b{display:block;font-size:14px;margin-bottom:3px}
.dl-tile span{font-size:12px;color:var(--muted)}
.menu{position:fixed;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;box-shadow:var(--sh-pop);padding:5px;z-index:60;min-width:150px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;
  padding:7px 10px;border-radius:7px;font-size:13px;color:var(--body)}
.menu button{display:flex;align-items:center;justify-content:space-between;gap:14px}
.menu button:hover{background:var(--hover)}
.menu-div{height:1px;background:var(--divider);margin:4px 6px}
.menu .chev{color:var(--faint);font-size:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);
  color:#fff;border-radius:10px;padding:11px 16px;font-size:13.5px;z-index:70;
  display:flex;align-items:center;gap:14px;box-shadow:var(--sh-pop);max-width:92vw}
#toast button{background:none;border:0;color:#fff;text-decoration:underline;font-size:13px;padding:0}

@media print{
  #sidebar,#topbar,#panel,#toast,.scrim{display:none!important}
  #app{display:block} #docscroll{overflow:visible;padding:0;background:#fff;display:block}
  .sheet{box-shadow:none;width:100%;max-width:none;aspect-ratio:auto;min-height:0;
    page-break-after:always;padding:34px 40px 64px}
  .sheet:last-child{page-break-after:auto}
  .dsec.sel{box-shadow:none;background:none}
  .tag{display:none}
  @page{size:A4;margin:0}
}
</style>
